<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arquitectura AWS → draw.io</title>
<style>
:root{color-scheme:light dark;--b:#232F3E;--o:#ED7100}
body{font:15px system-ui,sans-serif;margin:0;background:#f4f5f7;color:#1b2430}
header{background:var(--b);color:#fff;padding:14px 24px}header b{color:var(--o)}
main{max-width:1100px;margin:20px auto;padding:0 16px;display:grid;gap:16px}
section{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px #0002}
textarea{width:100%;min-height:140px;box-sizing:border-box;font:inherit;padding:10px;border:1px solid #bbb;border-radius:6px}
button{background:var(--o);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:15px;cursor:pointer}
button.alt{background:var(--b)}button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
#preview svg{width:100%;height:auto;background:#fff;border:1px solid #ddd;border-radius:6px}
.note{color:#555;font-size:13px}.err{color:#b00020;font-weight:600}.warn{color:#8a5a00}
ul{margin:6px 0 0 18px;padding:0}
</style></head><body>
<header><b>AWS</b> · Arquitectura de alto nivel → <code>.drawio</code> <span class="note" style="color:#cbd">(local, tus datos no salen del equipo en modo offline)</span></header>
<main>
<section>
<label for="t"><b>Caso de uso / requisitos</b></label>
<textarea id="t" placeholder="Ej: Portal web con login, base de datos relacional, colas para correos, archivos e imágenes, WAF…"></textarea>
<div class="row">
<input id="f" type="file" multiple accept=".pdf,.docx,.txt,.md,.png,.jpg,.jpeg,.gif,.webp">
<label>Modo <select id="m"><option value="offline">Offline (reglas, instantáneo)</option><option value="ai" id="aiopt">Con IA (ANTHROPIC_API_KEY)</option></select></label>
<button id="go">Generar arquitectura</button>
</div>
<p class="note" id="hint"></p>
<p id="msg"></p>
</section>
<section id="out" hidden>
<div class="row"><b id="ttl"></b><span class="note" id="meta"></span></div>
<div id="preview"></div>
<p class="note">Vista previa simplificada. El archivo <code>.drawio</code> trae los íconos oficiales de AWS.</p>
<div class="row"><button id="dl" class="alt">Descargar .drawio</button><button id="sv">Guardar y abrir en VS Code</button><span id="sres" class="note"></span></div>
<div id="warns"></div>
<details><summary>Componentes</summary><ul id="comps"></ul></details>
</section>
</main>
<script>
const AI=__AI__, $=id=>document.getElementById(id); let last=null;
if(!AI){$('aiopt').disabled=true;$('hint').textContent='Modo IA desactivado: define ANTHROPIC_API_KEY antes de iniciar la UI. Sin IA no se interpretan imágenes.'}
const b64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=ko;r.readAsDataURL(f)});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
$('go').onclick=async()=>{
 $('msg').textContent='';$('go').disabled=true;const t0=performance.now();
 try{
  const files=await Promise.all([...$('f').files].map(async f=>({name:f.name,data:await b64(f)})));
  const j=await post('/api/generate',{text:$('t').value,mode:$('m').value,files});
  last=j;$('out').hidden=false;$('ttl').textContent=j.title;
  $('meta').textContent=`${j.components.length} componentes · planner: ${j.planner} · ${((performance.now()-t0)/1000).toFixed(1)} s`;
  $('preview').innerHTML=j.svg;$('sres').textContent='';
  $('warns').innerHTML=j.warnings.map(w=>`<p class="warn">⚠ ${esc(w)}</p>`).join('');
  $('comps').innerHTML=j.components.map(c=>`<li><b>${esc(c.label)}</b> <span class="note">(${esc(c.service)})</span></li>`).join('');
 }catch(e){$('msg').innerHTML=`<span class="err">${esc(e.message)}</span>`}
 $('go').disabled=false};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([last.xml],{type:'application/xml'}));a.download=last.filename;a.click()};
$('sv').onclick=async()=>{try{const j=await post('/api/save',{xml:last.xml,filename:last.filename});$('sres').textContent=(j.opened?'Abierto en VS Code: ':'Guardado (no se encontró el comando "code"): ')+j.path}catch(e){$('sres').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
</script></body></html>
